name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Run the test suite
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest rheia/TESTS -q

  lint:
    name: flake8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Check the modules changed since the lint baseline
        # The older modules still carry a backlog of style findings, so the
        # gate covers the files that are already clean. Extend this list as
        # modules are cleaned up.
        run: |
          python -m flake8 \
            rheia/UQ/characterize_uncertainty.py \
            rheia/TESTS/test_characterize_uncertainty.py \
            rheia/TESTS/test_regressions.py \
            examples/characterize_uncertainty.py
